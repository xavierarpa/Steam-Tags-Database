name: Build and Release CSV

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run game database script
        run: python game_database.py

      - name: Export to CSV
        run: python export_to_csv.py

      - name: Create ZIP file
        run: zip games_export.zip games_export.csv

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.date.outputs.date }}
          name: Steam Tags Database ${{ steps.date.outputs.date }}
          body: |
            Automated release of Steam Tags Database.
            
            This release includes:
            - `games_export.zip`: ZIP file containing the CSV export of the Steam games database with their tags.
          files: games_export.zip
          draft: false
          prerelease: false
